%YAML:1.0

# Diagnostic stereo-only configuration. This keeps the same D435i camera
# contract as the MAVROS/Pixhawk VIO config, but disables IMU factors so we can
# separate visual depth/feature failures from IMU preintegration failures.

imu: 0
num_of_cam: 2

imu_topic: "/vins/imu/data"
image0_topic: "/camera/camera/infra1/image_rect_raw"
image1_topic: "/camera/camera/infra2/image_rect_raw"
output_path: "/workspace/under_water_image_match/outputs/ros2_vins_fusion_live/"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 848
image_height: 480

use_gpu: 0
use_gpu_acc_flow: 0
use_gpu_ceres: 0

estimate_extrinsic: 0

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0., 0., 1., 6.1540000000000000e-02,
       -1., 0., 0., 1.9820000000000000e-02,
       0., -1., 0., 2.2930000000000000e-02,
       0., 0., 0., 1. ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0., 0., 1., 6.2540000000000000e-02,
       -1., 0., 0., -3.1030000000000000e-02,
       0., -1., 0., 2.2930000000000000e-02,
       0., 0., 0., 1. ]

multiple_thread: 0
stereo_sync_tolerance: 0.003
drop_old_frames: 0
image_qos_depth: 2000
image_qos_reliable: 1

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1
stereo_max_y_diff_px: 3.0
stereo_min_disparity_px: 2.0
stereo_max_disparity_px: 80.0
stereo_gate_log_interval: 10

max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 5.00
gyr_n: 0.10
acc_w: 0.020
gyr_w: 0.002
g_norm: 8.90

estimate_td: 0
td: 0.0

load_previous_pose_graph: 0
pose_graph_save_path: "/home/dji/output/pose_graph/"
save_image: 0

world_frame_id: "world"
body_frame_id: "fcu_link"
camera_frame_id: "camera_infra1_optical_frame"
