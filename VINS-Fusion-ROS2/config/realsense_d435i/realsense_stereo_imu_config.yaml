%YAML:1.0

# D435i stereo + D435i IMU configuration for the standard ROS2 VINS-Fusion
# estimator contract. DVL and localization references are not estimator inputs.

imu: 1
num_of_cam: 2

imu_topic: "/camera/camera/imu"
image0_topic: "/camera/camera/infra1/image_rect_raw"
image1_topic: "/camera/camera/infra2/image_rect_raw"
output_path: "/workspace/under_water_image_match/outputs/ros2_vins_fusion_live/"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 848
image_height: 480

use_gpu: 0
use_gpu_acc_flow: 0
use_gpu_ceres: 0

# Bag TF contract: body is camera_gyro_optical_frame and cam0/cam1 are D435i
# IR optical frames. This config is for the RealSense IMU route, not MAVROS.
estimate_extrinsic: 1

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 1., 0., 0., -0.00552,
           0., 1., 0.,  0.00510,
           0., 0., 1.,  0.01174,
           0., 0., 0.,  1. ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 1., 0., 0.,  0.04451650043634849,
           0., 1., 0.,  0.00510,
           0., 0., 1.,  0.01174,
           0., 0., 0.,  1. ]

multiple_thread: 0
stereo_sync_tolerance: 0.003
drop_old_frames: 0
image_qos_depth: 2000
image_qos_reliable: 1

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 1.00
gyr_n: 0.10
acc_w: 0.020
gyr_w: 0.002
g_norm: 9.805

estimate_td: 0
td: 0.0

load_previous_pose_graph: 0
pose_graph_save_path: "/home/dji/output/pose_graph/"
save_image: 0

world_frame_id: "world"
body_frame_id: "body"
camera_frame_id: "camera"
